<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title
</head>
<body>
    <form style="color:gold;">
        <h1>STUDENT REGISTRATION FORM</h1>
        <table style="color:darkviolet;">
            <tr>
                <td>name:</td>
                <td>
                    <input= type="text" placeholder="ENTER YOUR NAME">
                </td>
            </tr>
            <tr>
                <td>email:</td>
                <td>
                    <input type="email" placeholder="ENTER YOUR EMAIL">
                </td>

            </tr>
            <tr>
                <td>age:</td>
                <td>
                    <input type="text" placeholder="ENTER YOUR AGE">

                </td>
            </tr>
            <tr>
                <td>addres:</td>
                <td>
                    <input type="text" placeholder="enter your addres">

                </td>
            </tr>
            <tr>
                <td>gender:</td>
                <td>
                    <input type="radio" name="gender">MALE
                    <input type="radio" name="gender">FEMALE
                </td>
            </tr>
            <tr>
                <td>department:</td>
                <td>
                    <select>
                        <option>IT</option>
                        <option>CSE</option>
                        <option>EEE</option>
                        <option>ECE</option>
                </select>
                </td>
            </tr>
            <tr> 
                <td><input type="submit"></td>
                <td><input type="reset"></td>
            </tr>
            <tr>
                <td>
                    DOB:
                </td>
                <td> 
                    <input type="date">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="search" placeholder="search">
                </td>
            <tr>
                <td>color:</td>
                    <td><input type="color">

                </td>
            </tr>
            <tr>
                <td>
                    <img src="" alt="">
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
